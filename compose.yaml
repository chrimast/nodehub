name: nodehub
services:
  api:
    build: .
    environment:
      DATABASE_URL: sqlite:///state/nodehub.db
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY (64 hex chars)}
      SHARE_ADDR: 0.0.0.0:8091
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN (>=32 bytes)}
      HTTP_ADDR: 0.0.0.0:8080
      GOMEMLIMIT: 128MiB
      AGENT_RELEASE_DIR: /app/agent-releases
    volumes:
      - nodehub-data:/state
      - ./agent-releases:/app/agent-releases:ro
    mem_limit: 192m
    pids_limit: 64
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:18091:8091"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  web:
    build: ./web
    ports: ["18080:8080"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 64m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  nodehub-data:
